<title>India · China · Eastern Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one stacked card of zone rows, each with a day/night track you drag; all rows move together */
:root {
  --bg: #f6f7fb;
  --card: #ffffff;
  --line: #dfe3ec;
  --fg: #12151c;
  --muted: #5f6676;
  --accent: #2f6db5;
  --accent-fg: #ffffff;
  --night: #4a6896;
  --day: #e8d6a0;
  --thumb: #ffffff;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --card: #171b24; --line: #2a303d; --fg: #eef1f6; --muted: #9aa2b3;
    --accent: #5b95dc; --accent-fg: #0b0e14; --night: #2e4670; --day: #b9a46a; --thumb: #f2f4f8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --card: #171b24; --line: #2a303d; --fg: #eef1f6; --muted: #9aa2b3;
  --accent: #5b95dc; --accent-fg: #0b0e14; --night: #2e4670; --day: #b9a46a; --thumb: #f2f4f8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); padding: 24px 16px 48px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; font-size: 0.95rem; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); }
.toolbar input[type="date"] {
  font: 600 1rem var(--font); color: var(--fg); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.btn {
  font: 700 0.95rem var(--font); border-radius: 10px; padding: 10px 18px; min-height: 44px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.spacer { flex: 1; }
.live { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #2fa865; }
.live.off .dot { background: var(--muted); }

.row { padding: 22px 20px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 14px; }
.row:last-child { border-bottom: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.name { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
.zone { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
.zone b { color: var(--accent); font-weight: 600; }
.time { text-align: right; }
.clock { font-size: clamp(2rem, 6vw, 2.9rem); font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.meta { color: var(--muted); font-size: 0.95rem; margin-top: 6px; }
.meta .diff { color: var(--accent); font-weight: 600; }

input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; cursor: grab;
}
input[type="range"]:active { cursor: grabbing; }
input[type="range"]::-webkit-slider-runnable-track {
  height: 16px; border-radius: 99px;
  background: linear-gradient(90deg, var(--night) 0%, var(--night) 21%, var(--day) 29%, var(--day) 71%, var(--night) 79%, var(--night) 100%);
}
input[type="range"]::-moz-range-track {
  height: 16px; border-radius: 99px;
  background: linear-gradient(90deg, var(--night) 0%, var(--night) 21%, var(--day) 29%, var(--day) 71%, var(--night) 79%, var(--night) 100%);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 30px; height: 30px; margin-top: -7px; border-radius: 50%;
  background: var(--thumb); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
input[type="range"]::-moz-range-thumb {
  width: 30px; height: 30px; border-radius: 50%; background: var(--thumb); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.ticks { display: grid; grid-template-columns: repeat(8, 1fr); font-size: 0.78rem; color: var(--muted); font-family: var(--mono); margin-top: -4px; }
.ticks span { border-left: 1px solid var(--line); padding: 4px 0 0 4px; }

.overlap { padding: 16px 20px; font-size: 0.9rem; color: var(--muted); display: grid; gap: 4px; }
.overlap strong { color: var(--fg); }
@media (max-width: 520px) {
  .ticks span:nth-child(even) { visibility: hidden; }
  .name { font-size: 1.35rem; }
  .row { padding-inline: 16px; }
}
</style>

<div class="wrap">
  <header>
    <h1>India · China · Eastern Time</h1>
    <p class="sub">Drag any bar to move all clocks together. Arrow keys step 15 minutes.</p>
  </header>

  <section class="card">
    <div class="toolbar">
      <input type="date" id="date" aria-label="Date in India">
      <button class="btn primary" id="now">⟲ Now</button>
      <span class="spacer"></span>
      <span class="live" id="live"><span class="dot"></span><span id="liveText">Live</span></span>
    </div>
    <div id="rows"></div>
    <div class="overlap" id="overlap"></div>
  </section>
</div>

<script>
const ZONES = [
  { id: "ist", name: "India", tz: "Asia/Kolkata", sub: "India Standard Time" },
  { id: "bjs", name: "Beijing", tz: "Asia/Shanghai", sub: "China Standard Time" },
  { id: "et",  name: "New York", tz: "America/New_York", sub: "Eastern Time" },
];
const HOME = ZONES[0];

function parts(tz, t) {
  const f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23",
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const o = {};
  for (const p of f.formatToParts(new Date(t))) o[p.type] = p.value;
  return { y: +o.year, m: +o.month, d: +o.day, h: +o.hour % 24, min: +o.minute, s: +o.second };
}
function offsetMin(tz, t) {
  const p = parts(tz, t);
  return Math.round((Date.UTC(p.y, p.m - 1, p.d, p.h, p.min, p.s) - Math.floor(t / 1000) * 1000) / 60000);
}
function wallToUtc(tz, y, m, d, minutes) {
  const guess = Date.UTC(y, m - 1, d, 0, minutes);
  let off = offsetMin(tz, guess);
  let t = guess - off * 60000;
  const off2 = offsetMin(tz, t);
  if (off2 !== off) t = guess - off2 * 60000;
  return t;
}
function abbr(tz, t) {
  const n = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "short" })
    .formatToParts(new Date(t)).find(p => p.type === "timeZoneName").value;
  if (tz === "Asia/Kolkata") return "IST";
  if (tz === "Asia/Shanghai") return "CST";
  return n; // EST or EDT
}
function utcLabel(off) {
  const sign = off >= 0 ? "+" : "−", a = Math.abs(off), h = Math.floor(a / 60), m = a % 60;
  return "UTC" + sign + h + (m ? ":" + String(m).padStart(2, "0") : "");
}
function fmtTime(h, m) {
  const ap = h < 12 ? "am" : "pm", hh = h % 12 || 12;
  return hh + ":" + String(m).padStart(2, "0") + " " + ap;
}
function fmtDate(tz, t) {
  return new Intl.DateTimeFormat("en-US", { timeZone: tz, weekday: "short", month: "short", day: "numeric" }).format(new Date(t));
}
function diffLabel(mins) {
  if (mins === 0) return "same time";
  const a = Math.abs(mins), h = Math.floor(a / 60), m = a % 60;
  const s = (h ? h + "h" : "") + (m ? " " + m + "m" : "");
  return s.trim() + (mins > 0 ? " ahead of India" : " behind India");
}

let instant = Date.now();
let live = true;

const rowsEl = document.getElementById("rows");
const ticks = ["12am","3am","6am","9am","12pm","3pm","6pm","9pm"].map(x => `<span>${x}</span>`).join("");
rowsEl.innerHTML = ZONES.map(z => `
  <div class="row">
    <div class="head">
      <div><div class="name">${z.name}</div><div class="zone">${z.sub} | <b id="${z.id}-abbr"></b></div></div>
      <div class="time"><div class="clock" id="${z.id}-clock"></div><div class="meta" id="${z.id}-meta"></div></div>
    </div>
    <div>
      <input type="range" id="${z.id}-range" min="0" max="1425" step="15" aria-label="${z.name} time of day">
      <div class="ticks" aria-hidden="true">${ticks}</div>
    </div>
  </div>`).join("");

ZONES.forEach(z => {
  document.getElementById(z.id + "-range").addEventListener("input", e => {
    const p = parts(z.tz, instant);
    instant = wallToUtc(z.tz, p.y, p.m, p.d, +e.target.value);
    setLive(false);
    render();
  });
});

document.getElementById("date").addEventListener("change", e => {
  if (!e.target.value) return;
  const [y, m, d] = e.target.value.split("-").map(Number);
  const p = parts(HOME.tz, instant);
  instant = wallToUtc(HOME.tz, y, m, d, p.h * 60 + p.min);
  setLive(false);
  render();
});
document.getElementById("now").addEventListener("click", () => { instant = Date.now(); setLive(true); render(); });

function setLive(on) {
  live = on;
  document.getElementById("live").classList.toggle("off", !on);
  document.getElementById("liveText").textContent = on ? "Live" : "Custom time";
}

function render() {
  const homeOff = offsetMin(HOME.tz, instant);
  ZONES.forEach(z => {
    const p = parts(z.tz, instant), off = offsetMin(z.tz, instant);
    document.getElementById(z.id + "-abbr").textContent = abbr(z.tz, instant);
    document.getElementById(z.id + "-clock").textContent = fmtTime(p.h, p.min);
    const diff = z === HOME ? "" : ` | <span class="diff">${diffLabel(off - homeOff)}</span>`;
    document.getElementById(z.id + "-meta").innerHTML = `${utcLabel(off)} | ${fmtDate(z.tz, instant)}${diff}`;
    const r = document.getElementById(z.id + "-range");
    if (document.activeElement !== r) r.value = Math.min(1425, Math.round((p.h * 60 + p.min) / 15) * 15);
  });
  const hp = parts(HOME.tz, instant);
  document.getElementById("date").value = `${hp.y}-${String(hp.m).padStart(2,"0")}-${String(hp.d).padStart(2,"0")}`;
  renderOverlap();
}

// Working hours (9am–6pm) that India, China and US Eastern share on the selected India date
function renderOverlap() {
  const hp = parts(HOME.tz, instant);
  const start = wallToUtc(HOME.tz, hp.y, hp.m, hp.d, 0);
  const isWork = (tz, t) => { const p = parts(tz, t); return p.h >= 9 && p.h < 18; };
  const ok = (t, list) => list.every(z => isWork(z.tz, t));
  const span = list => {
    let first = null, last = null;
    for (let i = 0; i < 96; i++) {
      const t = start + i * 15 * 60000;
      if (ok(t, list)) { if (first === null) first = t; last = t + 15 * 60000; }
    }
    if (first === null) return "none";
    const a = parts(HOME.tz, first), b = parts(HOME.tz, last);
    return `${fmtTime(a.h, a.min)} – ${fmtTime(b.h, b.min)} India time`;
  };
  document.getElementById("overlap").innerHTML =
    `<div>Shared office hours (9am–6pm), India + China: <strong>${span([ZONES[0], ZONES[1]])}</strong></div>` +
    `<div>India + New York: <strong>${span([ZONES[0], ZONES[2]])}</strong></div>`;
}

setInterval(() => { if (live) { instant = Date.now(); render(); } }, 15000);
render();
</script>
